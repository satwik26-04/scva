[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scva"
version = "1.0.0"
description = "Scientific Citation Verification Agent — production-grade bibliographic and semantic citation auditing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SCVA" }]
keywords = ["citation", "bibliography", "bibtex", "verification", "scientific"]

dependencies = [
    "aiohttp>=3.9",
    "bibtexparser>=1.4.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
llm = ["google-generativeai>=0.5", "openai>=1.0"]
dev  = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
scva = "scva.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scva*"]

[tool.setuptools.package-data]
scva = ["py.typed"]
"*" = ["templates/*.html"]
